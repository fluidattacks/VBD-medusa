openapi: 3.0.0
info:
  version: 2.21.2
  title: Medusa Storefront API
  license:
    name: MIT
    url: https://github.com/medusajs/medusa/blob/master/LICENSE
servers:
  - url: http://localhost:9000
  - url: https://api.medusajs.com
paths:
  /auth/customer/emailpass/verification/confirm:
    post:
      operationId: PostActor_typeAuth_providerVerificationConfirm
      summary: Verify the Customer's Email
      description: Verifies the customer's email using a token that is typically sent to their email address. This is used to confirm the customer's email during registration or authentication when [email verification is required](https://docs.medusajs.com/resources/commerce-modules/auth/auth-providers/emailpass). You can listen to the `auth.verification_requested` event in a subscriber and send an email to the customer with the verification token.
      x-authenticated: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The details required to verify the customer's email.
              required:
                - token
              properties:
                token:
                  type: string
                  title: token
                  description: The verification token sent to the customer's email address.
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl -X POST '{backend_url}/auth/customer/emailpass/verification/confirm' \
            -H 'Content-Type: application/json' \
            --data-raw '{
              "token": "{value}"
            }'
      tags:
        - Auth
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/400_error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/invalid_state_error'
        '422':
          $ref: '#/components/responses/invalid_request_error'
        '500':
          $ref: '#/components/responses/500_error'
  /store/customers/me/addresses/{address_id}:
    get:
      operationId: GetCustomersMeAddressesAddress_id
      summary: Get Customer's Address
      x-sidebar-summary: Get Address
      description: Retrieve an address of the logged-in customer. You can expand the address's relations or select the fields that should be returned.
      x-authenticated: true
      parameters:
        - name: address_id
          in: path
          description: The address's ID.
          required: true
          schema:
            type: string
        - name: x-publishable-api-key
          in: header
          description: Publishable API Key created in the Medusa Admin.
          required: true
          schema:
            type: string
            externalDocs:
              url: https://docs.medusajs.com/api/store#publishable-api-key
        - name: x-medusa-locale
          in: header
          description: The locale in BCP 47 format to retrieve localized content.
          required: false
          schema:
            type: string
            example: en-US
            externalDocs:
              url: https://docs.medusajs.com/resources/commerce-modules/translation/storefront
              description: Learn more in the Serve Translations in Storefront guide.
        - name: fields
          in: query
          description: Comma-separated fields that should be included in the returned data. if a field is prefixed with `+` it will be added to the default fields, using `-` will remove it from the default fields. without prefix it will replace the entire default fields. This API route restricts the fields that can be selected. Learn how to override the retrievable fields in the [Retrieve Custom Links](https://docs.medusajs.com/learn/fundamentals/api-routes/retrieve-custom-links) documentation.
          required: false
          schema:
            type: string
            title: fields
            description: Comma-separated fields that should be included in the returned data. if a field is prefixed with `+` it will be added to the default fields, using `-` will remove it from the default fields. without prefix it will replace the entire default fields. This API route restricts the fields that can be selected. Learn how to override the retrievable fields in the [Retrieve Custom Links](https://docs.medusajs.com/learn/fundamentals/api-routes/retrieve-custom-links) documentation.
            externalDocs:
              url: '#select-fields-and-relations'
        - name: locale
          in: query
          description: The locale in BCP 47 format to retrieve localized content.
          required: false
          schema:
            type: string
            example: en-US
            externalDocs:
              url: https://docs.medusajs.com/resources/commerce-modules/translation/storefront
              description: Learn more in the Serve Translations in Storefront guide.
      security:
        - cookie_auth: []
        - jwt_token: []
      x-codeSamples:
        - lang: JavaScript
          label: JS SDK
          source: |-
            import Medusa from "@medusajs/js-sdk"

            let MEDUSA_BACKEND_URL = "http://localhost:9000"

            if (process.env.NEXT_PUBLIC_MEDUSA_BACKEND_URL) {
              MEDUSA_BACKEND_URL = process.env.NEXT_PUBLIC_MEDUSA_BACKEND_URL
            }

            export const sdk = new Medusa({
              baseUrl: MEDUSA_BACKEND_URL,
              debug: process.env.NODE_ENV === "development",
              publishableKey: process.env.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY,
            })

            // TODO must be authenticated as the customer to retrieve their address
            sdk.store.customer.retrieveAddress(
              "caddr_123"
            )
            .then(({ address }) => {
              console.log(address)
            })
        - lang: Shell
          label: cURL
          source: |-
            curl '{backend_url}/store/customers/me/addresses/{address_id}' \
            -H 'Authorization: Bearer {jwt_token}' \
            -H 'x-publishable-api-key: {your_publishable_api_key}'
      tags:
        - Customers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreCustomerAddressResponse'
        '400':
          $ref: '#/components/responses/400_error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/invalid_state_error'
        '422':
          $ref: '#/components/responses/invalid_request_error'
        '500':
          $ref: '#/components/responses/500_error'
      x-allowed:
        - id
        - address_name
        - company
        - customer_id
        - first_name
        - last_name
        - address_1
        - address_2
        - city
        - province
        - postal_code
        - country_code
        - phone
        - metadata
        - is_default_shipping
        - is_default_billing
        - created_at
        - updated_at
